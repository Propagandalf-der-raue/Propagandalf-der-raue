<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Video zu GIF (Live-Modus)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #999; }
    input { margin-bottom: 10px; display: block; }
  </style>
</head>
<body>
  <h1>Video zu GIF – Live Preview</h1>
  <input type="file" id="videoInput" accept="video/*"><br>

  <label>GIF-Breite (px):</label>
  <input type="number" id="gifWidth" value="320"><br>

  <label>FPS (Frames pro Sekunde):</label>
  <input type="number" id="fpsInput" value="10"><br>

  <button id="startBtn">GIF erstellen</button>
  <p id="status">Bereit.</p>
  <canvas id="canvas"></canvas>
  <div id="output"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script>
    const videoInput = document.getElementById('videoInput');
    const startBtn = document.getElementById('startBtn');
    const gifWidthInput = document.getElementById('gifWidth');
    const fpsInput = document.getElementById('fpsInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    let gif;

    startBtn.onclick = () => {
      const file = videoInput.files[0];
      if (!file) return alert("Bitte wähle ein Video.");

      const fps = parseInt(fpsInput.value) || 10;
      const desiredWidth = parseInt(gifWidthInput.value);

      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;
      video.playsInline = true;
      video.crossOrigin = "anonymous";

      video.addEventListener('loadedmetadata', () => {
        const aspect = video.videoHeight / video.videoWidth;
        const width = desiredWidth;
        const height = Math.round(width * aspect);

        canvas.width = width;
        canvas.height = height;

        gif = new GIF({
          workers: 2,
          quality: 10,
          width,
          height,
          workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
        });

        let lastFrameTime = 0;
        const frameInterval = 1 / fps;
        let prevTime = 0;

        const draw = (time) => {
          if (video.paused || video.ended) return finishGIF();

          const currentTime = video.currentTime;
          if (currentTime - lastFrameTime >= frameInterval) {
            ctx.drawImage(video, 0, 0, width, height);
            gif.addFrame(ctx, {copy: true, delay: 1000 / fps});
            lastFrameTime = currentTime;
            status.textContent = `Sammle Frames... (${currentTime.toFixed(2)}s)`;
          }

          requestAnimationFrame(draw);
        };

        video.onended = finishGIF;
        video.play().then(() => {
          requestAnimationFrame(draw);
        });

        function finishGIF() {
          status.textContent = "GIF wird gerendert...";
          gif.on('finished', blob => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);
            output.innerHTML = '';
            output.appendChild(img);
            status.textContent = "GIF ist fertig – hol dir dein Meisterwerk!";
          });
          gif.render();
        }
      });

      video.load();
    };
  </script>
</body>
</html>
